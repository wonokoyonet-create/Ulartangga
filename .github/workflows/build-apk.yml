name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --version
          sdkmanager --licenses </dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="UlarTanggaPasutri-Android-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP proyek tidak ditemukan."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Struktur proyek ==="
          find extracted -maxdepth 4 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) -print

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug --stacktrace

          elif [ -f "./build.gradle" ] || \
               [ -f "./build.gradle.kts" ]; then
            gradle --no-daemon assembleDebug --stacktrace

          else
            echo "ERROR: File build.gradle tidak ditemukan."
            exit 1
          fi

      - name: Verify APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Direktori APK tidak ditemukan."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" \
            -print -quit | grep -q . || {
              echo "ERROR: APK tidak berhasil dibuat."
              exit 1
            }

          echo "APK berhasil dibuat:"
          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UlarTanggaPasutri-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
