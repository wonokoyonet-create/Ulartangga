name: Build Android APK

'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout source
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Extract project
    run: unzip -q UlarTanggaPasutri-Android-Project.zip -d extracted

  - name: Inspect project structure
    run: |
      find extracted -maxdepth 4 -type f | head -100
      find extracted -name settings.gradle -o -name settings.gradle.kts

  - name: Build APK
    run: |
      PROJECT_DIR="$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
      test -n "$PROJECT_DIR"
      gradle -p "$PROJECT_DIR" assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: UlarTanggaPasutri-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
